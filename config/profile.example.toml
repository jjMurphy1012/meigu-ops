# meigu-ops 账户与策略参数
#
# 用法:cp config/profile.example.toml config/profile.toml 后填写真实值。
# config/profile.toml 已被 gitignore —— 真实账户号只存在于那里,绝不进仓。
#
# 格式选 TOML 是因为 Python 3.11+ 的 tomllib 是标准库,脚本零依赖。

[account]
# 用于下单的子账户号。主账户只读,不在这里填。
id = "000000000"
# 对外展示只露后 4 位(汇报、日报里用这个)。
display_last4 = "0000"
broker = "robinhood"
# "cash" 的卖出资金 T+1 结算:当天卖的钱当天不能全部再买。
# "margin" 无此限制,但会改变风险口径 —— 改这个值要同步复核纪律。
type = "cash"

[execution]
# ============================================================================
# ⚠️ 下单授权 —— 默认**全部关闭**。
#
# 授权是本地事实,不是项目属性:clone 这个仓库不应该让任何人继承别人的下单授权。
# 所以它住在这个 gitignore 的文件里,而且默认关闭。
#
# 打开前请先读 DISCLAIMER.md。本项目可以向券商提交真实订单。
# ============================================================================

# 总开关。false 时任何 mode 都不得调用 place_equity_order。
enabled = false

# 只走分析 → preflight → review,不真正 place。开真钱前建议先跑一段 dry_run。
dry_run = true

# true = 每笔下单前必须等用户明确确认。
# 设为 false 才是"已授权自动下单,无需逐笔确认" —— 但"分析永远在下单之前"
# 是无法关闭的硬条件(见 AGENTS.md 铁律)。
require_confirmation = true

# 真钱执行的两档。开真钱与放开仓位是**两个独立决定**:
#   "guarded"     刚开真钱:仓位统一压到 size_scale_observe,不管规则状态多好
#   "autonomous"  运行健康、你确认之后:仓位按规则 status 缩放
# 由 scripts/setup.py --authorize-live 设置,不建议手改。
live_mode = "guarded"

# --- 硬性金额闸门(由 scripts/preflight.py 强制,不依赖 agent 自觉)---
# 这四条是**无条件**的:不随证据强度变化,任何规则都绕不过。
# 开启自动交易前先确认它们是你能承受单日全损的量级。
max_order_usd = 80        # 单笔上限
max_daily_usd = 200       # 单日累计上限(买+卖分别计)
max_orders_per_day = 6    # 单日笔数上限

# --- 按证据强度自动缩放单笔尺寸 ---
# 上面的 max_order_usd 再乘以下面的系数,由 preflight 自动执行 —— 不需要人工缩小。
#
# 为什么这么设计:第一天你的每条规则都还没有数据支持。若"未验证"直接等于
# "不许交易",你永远攒不到验证它所需的数据 —— 那是个死锁。
# 所以证据强度决定**仓位大小**,而不是决定**能不能交易**。
#
# 订单可用 rule_ids 声明本笔依据了哪些规则;**未声明按最低档**处理
# (无法核实依据 = 无法给更大尺寸)。多条依据取其中最强的一条。
# ★ 档位由规则的 status 决定,**不由审计结果自动决定** ——
#   否则"改状态需要你批准"就形同虚设:攒够样本自动满额,你从未同意过。
#   审计只产生升级**建议**,实际放大要 rules.py --set-status --approved。
size_scale_observe   = 0.4   # hypothesis(默认;新写的规则都在这里)
size_scale_weak      = 0.7   # provisional(你批准了部分放大)
size_scale_supported = 1.0   # supported(你批准了满额)

# 注意:以上只约束**买入**。卖出是降低风险,不受证据强度、单笔上限、
# 单日金额上限约束 —— 否则系统会变成"允许建仓、不允许平仓"。

# --- 时效闸门 ---
# 交易意图的有效期(分钟)。超过就必须重新分析,不许执行陈旧意图。
intent_ttl_minutes = 15
# review 返回的券商报价时间戳与当前时间的最大允许偏差(分钟)。
# 券商服务器时间戳是唯一可信时钟 —— 本机时钟可能因休眠停在旧时刻。
quote_max_age_minutes = 10

# --- 紧急停止 ---
# 该文件存在时,preflight 一律 DENY。想立刻停手就 `touch data/HALTED`。
kill_switch_file = "data/HALTED"

[trade]
currency = "USD"
# 单笔标准尺寸。纪律手册里所有"标准尺寸"都指这个值,不写死美元数。
size_std = 50
# 单笔硬上限。什么情况下才用到它,由你的策略决定。
size_max = 80
# 首仓不得超过计划仓位的这个比例。你的建仓纪律见 modes/_strategy.md。
first_entry_max_ratio = 0.5

[position]
# 单一标的占股票市值的上限 %。超限时怎么处理由你的策略决定。
max_single_pct = 50
# 单笔减仓占该仓位当前市值超过这个 % 时,preflight 会要求停下重算。
# 防的是:仓位已缩水到接近标准尺寸时,套用标准尺寸会让"部分减仓"变成近乎清仓。
reduce_pct_warn = 50
# 市值低于 size_std 这个倍数的仓位视为"残值仓"。怎么处理由你的策略决定。
residual_threshold_ratio = 0.5

[cash]
# 常态 buying power 目标(占总值 %)。定多少、超了算不算问题,由你的策略决定。
bp_target_pct = 20
# 可选的例外水位(例如你对某些日子有不同偏好)。什么时候用由你定义。
bp_target_pct_friday = 45
# 可选的防守水位。什么条件触发、什么条件解除,写进 modes/_strategy.md 与
# config/rules.toml —— 只给"切过去"的条件而不给"切回来"的条件是常见的执行滞后。
defensive_bp_pct = 45
# 绝对现金底线。preflight 会按它拦住会击穿底线的买单。
floor_pct = 15

[catalyst]
# 二元催化前的 blackout 小时数。窗口内怎么处理、是否外推到其他标的,
# 由你的策略决定(modes/_strategy.md「事件与催化」一节)。
blackout_hours = 48

[journal]
# 交易日志的防冗余分层压缩。日志无限膨胀会让复盘失去可读性,
# 但压太狠会丢掉复盘需要的细节 —— 这三个值是那个权衡的旋钮。
#
# data/journal.md 的全文行数硬上限。超限时一次性合并最老的多条条目。
max_lines = 150
# 保留全细节的交易日天数(超过这个天数的条目压成单行摘要)。
full_detail_days = 3
# 单行摘要的保留上界;超过这个天数则按周/按轮合并。
single_line_days = 14

[schedule]
timezone = "America/New_York"
# 调度器按会话启动时区解读表达式,且实测有 ~+30min 固定滞后。
# 排 cron 时用 ET 目标时刻 + 这个偏移量。详见 modes/_mechanics.md §4。
cron_offset_minutes = -30
checkpoints = ["09:12", "10:33", "13:03", "15:37", "16:06"]

[language]
# 全部人类可读输出的语言。股票代码/ETF/指标名保留英文。
output = "zh-CN"
