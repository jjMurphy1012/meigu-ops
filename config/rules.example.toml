# 你的交易纪律 —— 可检验的规则清单
#
# 用法:cp config/rules.example.toml config/rules.toml 后自己填。
# config/rules.toml 已被 gitignore —— 这是你的策略,不进仓。
#
# ============================================================================
# 这个文件是干什么的
# ============================================================================
# 本仓库**不提供交易策略**。它提供的是一个让你的策略能被数据检验、
# 并因此不断修正的机制:
#
#     每日 journal ──► 今天有新证据触及哪条规则? → 追加进该规则的 evidence
#                          │
#     周期 review  ──► 逐条拿台账数据检验 ──► 升级 / 降级 / 退役
#                          │
#     次日 premarket ──► 按当前生效的规则决策;observe 层级的规则可进分析,
#                          但**不能单独授权真钱下单**
#
# **一条从未被数据支持过的规则是包袱,不是资产。** 定期审计;
# 被推翻的降为 refuted 保留记录,不要直接删。
# ============================================================================
#
# 字段:
#   id         稳定标识,改名不要改它(evidence 与散文版都靠它对齐)
#   statement  一句话说清规则。**要能被证伪**
#   kind       "process" 执行/流程纪律,与市场观点无关
#              "market"  市场判断,需要台账数据才能检验
#   test       怎么检验(见下方三种 type)
#   origin     "user"(默认)你自己写的;"ai" AI 代拟、你确认过的
#              origin = "ai" 时必须同时有 approved_at —— 没有它就分不清
#              "用户选择了信任 AI" 和 "AI 自己往文件里写了一条"。
#              两者走**完全相同**的生命周期,记出处只是为了复盘时能分开看:
#              我自己写的和 AI 代拟的,哪一类被数据推翻得更多?
#   status     "invariant"  不可关闭的流程不变量。无程序把守,靠流程保证。**不要删**
#              "enforced"   有程序把守(必须指向真实存在的闸门;删条目不会关闭闸门)
#              "hypothesis" 你相信但还没有数据支持
#              "supported"  已被台账数据支持
#              "refuted"    被数据推翻(**保留记录**,免得半年后当新发现再写一遍)
#              "retired"    已废止
#   execution_scope  "live"(可单独作为下单依据)/ "observe"(可进分析,不能单独授权
#              真钱下单)/ "none"(只留历史)。留空则按 status 推导:
#              invariant/enforced/supported → live;hypothesis → observe;其余 → none。
#              ★ 零样本的新假设默认只能 observe —— 不该拿真钱去试没被检验过的规则。
#   min_samples / weak_min_samples  该规则的样本门槛(默认 20 / 10)。
#              样本单位是**独立决策事件**(一笔卖出 = 一次退出决策),不是 FIFO lot 数。
#   evidence   证据行,每次复盘追加。**没有证据的规则半年后没人知道该不该信**
#   last_audited  上次审计日期(由 review 更新,不要手改)
#
# test 的三种 type:
#   { type = "enforced_by", by = "preflight:闸门名" }   闸门名会被交叉校验,写错会报错
#   { type = "tag_compare", better = [...], worse = [...] }
#                                标签必须存在于 config/reason-tags.toml,否则报错
#   { type = "manual", how = "怎么人工核查" }
#
# 审计结论分两个维度:方向(支持/反驳/数据不足)与强度(样本不足/弱/中/强)。
# 只有强度达到"中"以上才会**建议**改状态 —— 而且**任何状态变更都需要你本人批准**。

# ══════════════════════════════════════════════════════════════════════════
# 一、流程纪律(预置)
#
# 下面这些**与市场观点无关** —— 它们约束的是"怎么执行",不是"买什么"。
#
# status = "enforced" 的由脚本闸门把守:**删掉条目不会关闭闸门**,
#   要改行为得改 config/profile.toml 的参数或改代码。
# status = "invariant" 的无程序把守,靠流程保证:**不建议删除** ——
#   删掉它并不会让约束消失,只会让它从审计里消失。
# ══════════════════════════════════════════════════════════════════════════

[[rule]]
id        = "analysis-before-order"
statement = "每笔下单前必须已完成基于实时行情与持仓的分析,并有明确、具体的理由"
kind      = "process"
test      = { type = "manual", how = "复盘时抽查台账,每笔都能对应到一次分析记录" }
status    = "invariant"
evidence  = ["没有分析支撑的下单无法事后复盘,也无法归因 —— 它既不能证实也不能证伪任何规则"]
last_audited = ""

[[rule]]
id        = "size-check-before-trim"
statement = "减仓前必须先算这笔金额占该仓位当前市值的百分比,而不是只看金额落在标准区间内"
kind      = "process"
test      = { type = "enforced_by", by = "preflight:减仓占比" }
status    = "enforced"
evidence  = ["标准尺寸是相对'正常仓位'设计的。某仓位已大跌、市值缩水到接近标准尺寸时,同样金额的卖单占比会远超预期,'部分减仓'会变成近乎清仓"]
last_audited = ""

[[rule]]
id        = "intent-expiry"
statement = "交易意图只在有限时间窗内有效;超时或期间发生会话中断,必须重新拉行情分析"
kind      = "process"
test      = { type = "enforced_by", by = "preflight:意图时效" }
status    = "enforced"
evidence  = ["会话冻结或机器休眠后执行陈旧意图,比不执行更危险 —— 依据已经不成立"]
last_audited = ""

[[rule]]
id        = "broker-timestamp-fuse"
statement = "下单前必须核对券商返回的报价时间戳;本机时钟不可信"
kind      = "process"
test      = { type = "enforced_by", by = "preflight:报价时间戳熔断" }
status    = "enforced"
evidence  = ["机器可能在分析与下单之间休眠,系统时钟醒来前停在旧时刻。券商服务器时间戳是唯一可信时钟"]
last_audited = ""

[[rule]]
id        = "no-duplicate-same-symbol-same-day"
statement = "同一标的当日不重复操作(不同标的的多笔独立操作不受限)"
kind      = "process"
test      = { type = "enforced_by", by = "preflight:同标的当日重复" }
status    = "enforced"
evidence  = ["同日对同一标的反复操作通常是情绪驱动的加倍下注,而不是新出现的依据"]
last_audited = ""

[[rule]]
id        = "zero-action-must-be-a-conclusion"
statement = "决定不操作时,必须逐个点名每个候选被什么具体理由挡住,不能笼统说'没机会'"
kind      = "process"
test      = { type = "manual", how = "复盘时统计零操作检查点里有多少条给出了逐个点名的理由" }
status    = "invariant"
evidence  = ["零操作既可能是排查后的正确结论,也可能是回避。不逐个点名就无法区分这两者,也无法在复盘里发现'漏掉的机会'"]
last_audited = ""

[[rule]]
id        = "ledger-completeness"
statement = "当日每一笔成交都要在收盘前补齐进台账,以券商记录为准而非记忆"
kind      = "process"
test      = { type = "enforced_by", by = "stats:台账校验" }
status    = "enforced"
evidence  = ["台账缺一笔,整段历史的 FIFO 配对都会错 —— 所有绩效数字随之失真"]
last_audited = ""

[[rule]]
id        = "journal-structure-verified"
statement = "交易日志写入前后都要跑结构校验,不能只看编辑工具返回成功"
kind      = "process"
test      = { type = "enforced_by", by = "journal_compress:--check" }
status    = "enforced"
evidence  = ["字符串替换成功不代表文档结构正确。标题丢失会让正文变成挂在别人下面的孤儿段落,错序会让复盘读到错误的时间线"]
last_audited = ""


# ══════════════════════════════════════════════════════════════════════════
# 二、市场判断(空白 —— 这部分必须由你自己回答)
#
# 下面是你需要为自己回答的问题。**本仓库刻意不提供答案** ——
# 别人的现金目标、追高阈值、集中度上限对你毫无意义:
# 账户规模、风险承受度、主线偏好、可投入的盯盘时间全都不同。
#
# 回答方式:把每个答案写成一个 [[rule]] 块,kind = "market",
# status 从 "hypothesis" 起步,然后让台账数据决定它升级还是被推翻。
#
# 起步建议:**先只写 2-3 条你最相信的**。规则不是越多越好 ——
# 十条没被检验过的规则,不如两条被数据支持过的。
# ══════════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────
# 建仓 / 加仓
# ────────────────────────────────────────────────────────────────
#   · 什么条件下你才开一个新仓?什么条件下只是"观察"?
#   · 首仓占计划仓位的比例?              → config/profile.toml: trade.first_entry_max_ratio
#   · 单笔标准尺寸与极强信号的上限?       → config/profile.toml: trade.size_std / size_max
#   · 你用什么标准决定一次上涨值不值得跟?
#     ⚠️ 这条判定的两端都是真实的失败:太宽松 → 在情绪高点买入;
#        太严格 → 长期不操作,机会成本不出现在盈亏表里。你需要一条能被数据检验的
#        标准,而不是每次临场感觉。定在哪里由你决定。
#   · 出现什么信号时,你会认为"这个候选的判断已经失效"?那时你会怎么做?
#
# ────────────────────────────────────────────────────────────────
# 减仓 / 清仓
# ────────────────────────────────────────────────────────────────
#   · 你的退出决策有几种?它们的触发条件分别是什么?
#     (若用不同标签记录,就能用 tag_compare 检验哪一种对你更划算)
#   · 组合里同时有多个亏损仓位时,你按什么顺序处理?依据是什么?
#   · 你怎么区分"可以承受甚至加仓的回撤"和"必须退出的情况"?
#   · 触发线设在哪里?怎么设才能让"破没破位"成为无争议的事实判断,
#     而不是每次都要争论几美分?(整数价位附近的价格行为值得你自己观察一下)
#   · 减到什么程度会留下没有意义的零头?怎么处理?
#     → config/profile.toml: position.residual_threshold_ratio
#
# ────────────────────────────────────────────────────────────────
# 现金与仓位
# ────────────────────────────────────────────────────────────────
#   · 你的常态现金/买力目标是多少?依据是什么?
#     → config/profile.toml: cash.bp_target_pct / floor_pct
#   · 什么场景下你会偏离常态目标?**偏离之后凭什么回来?**
#     ⚠️ 给"切过去"定条件容易,给"切回来"定条件常被忘掉 —— 两个方向都要有条件,
#        否则你无法事后判断某次长期偏离是审慎还是拖延。
#   · 现金长期高于目标而未部署,你用什么标准区分"确实没机会"与"筛选过严"?
#     (闲置的机会成本是真实的,只是不出现在盈亏表里)
#
# ────────────────────────────────────────────────────────────────
# 分散与集中度
# ────────────────────────────────────────────────────────────────
#   · 单一标的占股票市值的上限?  → config/profile.toml: position.max_single_pct
#   · 你的组合里哪些仓位其实是同一个风险敞口?
#   · 你的候选池边界是什么?扩大它能增加机会,也会稀释你对每个标的的研究深度 ——
#     你怎么权衡?用什么信号提醒自己已经走到某一端?
#
# ────────────────────────────────────────────────────────────────
# 事件与催化
# ────────────────────────────────────────────────────────────────
#   · 已知的二元事件(财报、宏观数据、议息、长假)前,你暂停操作多久?
#     → config/profile.toml: catalyst.blackout_hours
#   · 这个暂停针对该标的,还是会外推到整个组合?两种做法各有代价 ——
#     范围太窄可能低估联动风险,太宽会让暂停期不断延长。你怎么划?
#   · 事件落地后,你按什么决定加、减、还是不动?
#
# ────────────────────────────────────────────────────────────────
# 时段
# ────────────────────────────────────────────────────────────────
#   · 不同时段你的操作门槛一样吗?买入与卖出呢?
#     (不同时段的流动性、点差、可用订单类型都不同 —— 见 modes/_mechanics.md §1。
#      这些机制差异是否该体现在你的门槛里,由你判断)
#   · 什么情况下你允许自己在流动性最差的时点用市价单?
#
# ────────────────────────────────────────────────────────────────
# 模板:把答案写成这样(新规则从 hypothesis 起步,默认只能 observe)
# ────────────────────────────────────────────────────────────────
# [[rule]]
# id        = "your-rule-id"
# statement = "一句能被证伪的话"
# kind      = "market"
# test      = { type = "tag_compare", better = ["你的标签A"], worse = ["你的标签B"] }
# status    = "hypothesis"
# evidence  = []
# last_audited = ""
