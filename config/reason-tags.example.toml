# 交易理由标签词表
#
# 用法:cp config/reason-tags.example.toml config/reason-tags.toml 后按自己的打法细分。
# config/reason-tags.toml 已被 gitignore —— 你的标签词表就是你的策略词汇,不进仓。
#
# ============================================================================
# 为什么默认只有四个
# ============================================================================
# 标签是**盈亏归集的维度**:`stats.py` 按卖出行的标签归集 FIFO 实现盈亏,
# `dashboard.py` 的纪律页据此对比不同打法的均笔表现。
#
# 所以标签词表决定了"你能检验哪些假设"。举例:如果你把减仓细分成
# "在反弹中主动降敞口" 和 "破位后被动防守",你才有可能用数据回答
# "哪一种对我更划算";如果只有一个 `减仓`,这个问题就问不出来。
#
# 但**怎么细分是你的策略,不是这个仓库的**。所以默认词表只保留四个纯动作词,
# 不含任何市场判断含义。细分方式由你自己定 —— 那正是自我进化的起点。
# ============================================================================

[tags]
# 买入方向可用的标签
buy = ["建仓", "加仓"]

# 卖出方向可用的标签
sell = ["减仓", "清仓"]

# ============================================================================
# 细分建议(仅方法,不给答案)
# ============================================================================
# 细分时对自己提三个问题:
#
#   1. 这两个标签背后是**不同的决策依据**吗?
#      (若只是"同一个理由的两次执行",别拆 —— 拆了只会稀释样本)
#
#   2. 我打算用它们检验什么假设?
#      写进 config/rules.toml 的 `test = { type = "tag_compare", ... }`。
#      **不打算检验的细分没有意义。**
#
#   3. 这个标签能在下单当时就确定吗?
#      事后才能判断的标签(比如"这笔是对的")不可用 —— 会污染归集。
#
# 一个可能的起点:先只按"主动还是被动"拆卖出(主动降敞口 vs 被动止损),
# 攒到 20 笔以上平仓配对再考虑更细。笔数不足时比率是噪音(见 modes/stats.md)。
#
# 约束:
#   · 标签不含制表符(台账是 TSV)
#   · buy 与 sell 不得有同名标签(否则归集会串)
#   · 改词表**不会**回溯改写 data/trades.tsv —— 旧行仍用旧标签,
#     校验会报错。改名时同步 sed 一遍台账,或保留旧标签直到它们退出统计窗口。
