# 示例词表 —— 演示与测试固件
#
# ⚠️ 这里的卖出标签刻意写成 **A / B 占位形式**,不代表任何推荐的分类方式。
#    本仓库不提供交易策略,也不暗示你"应该"按什么维度拆分退出决策。
#
# 它存在的唯一目的,是让 rules.toml 的 tag_compare 机制能在演示里跑起来:
# 要检验"哪一类退出决策对我更划算",你至少需要两组可比的标签。
# **怎么拆是你自己的事** —— 见 config/reason-tags.example.toml 的三个自问。

[tags]
buy  = ["建仓", "加仓"]
sell = ["减仓A", "减仓B", "清仓"]
